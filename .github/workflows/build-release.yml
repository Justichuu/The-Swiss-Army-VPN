name: Build and validate

on:
  push:
    branches:
      - main
      - "agent/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and validate release files
        shell: pwsh
        run: |
          $version = '1.0.9'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          .\scripts\Build-Release.ps1 -Version $version

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: switzerland-vpn-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*SHA256.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v8
        with:
          name: switzerland-vpn-${{ github.sha }}
          path: artifacts

      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath .\artifacts -File |
            Where-Object { $_.Extension -eq '.zip' -or $_.Name -like '*SHA256.txt' } |
            Sort-Object Name |
            ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) {
            throw "Expected four release assets, found $($assets.Count)."
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --title "Switzerland VPN $env:GITHUB_REF_NAME" `
            --generate-notes
